<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3442"/>
      <stop offset="100%" stop-color="#161c25"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f9e7d"/>
      <stop offset="100%" stop-color="#4ec9a0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Rising close line: the thing the whole app watches. -->
  <polyline points="168,700 296,612 424,656 552,470 680,528 856,300"
            fill="none" stroke="url(#spark)" stroke-width="58"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The 200 DMA it has to clear, dashed and flatter. -->
  <polyline points="168,760 856,612"
            fill="none" stroke="#5a7ca9" stroke-width="30"
            stroke-linecap="round" stroke-dasharray="6 64"/>

  <!-- Breakout marker at the last point. -->
  <circle cx="856" cy="300" r="62" fill="#4ec9a0"/>
  <circle cx="856" cy="300" r="62" fill="none" stroke="#161c25" stroke-width="20"/>
</svg>
